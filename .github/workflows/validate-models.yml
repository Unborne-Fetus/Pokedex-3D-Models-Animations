name: Validate Switch Model Catalog

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9][0-9][0-9]/**"
      - "scripts/build_model_manifest.py"
      - ".github/workflows/validate-models.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switch-model-catalog
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private model repository
        uses: actions/checkout@v4

      - name: Generate verified inventory
        run: python3 scripts/build_model_manifest.py

      - name: Commit updated private manifest
        run: |
          git add switch-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh validated private Switch model manifest"
            git push
          fi
